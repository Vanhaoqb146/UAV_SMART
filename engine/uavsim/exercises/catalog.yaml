exercises:
  - id: BT01
    version: 1
    code: BT01
    title: Làm quen 4 trục điều khiển
    difficulty: Cơ bản
    summary: Thực hành đẩy cần Ga, Tiến/Lùi (Pitch), Nghiêng ngang (Roll) và Quay về trung tâm với khoảng cách các cổng rộng 3.2m rõ ràng.
    objectives:
      - Tăng cần Ga (Throttle > 55%) để nâng UAV lên độ cao 1.4m
      - Đẩy cần Pitch tiến thẳng 3.2m tới cổng phía trước (3.2, 0.0, 1.4)
      - Đẩy cần Roll dịch ngang 3.2m sang cổng bên phải (3.2, -3.2, 1.4)
      - Đưa UAV bay đường chéo 4.5m quay về giữ tại điểm trung tâm (0.0, 0.0, 1.4)
    default_mode: position_hold
    time_limit_sec: 100
    corridor_radius: 0.72
    start_pos: [0.0, 0.0, 0.05]
    start_yaw: 0.0
    environment:
      wind_max: 0.0
      gust_sigma: 0.0
      map_preset: airbase
      arena_bounds: [6.5, 6.5, 5.0]
      speed_scale: 1.5
      obstacles: []
    stages:
      - name: Cất cánh lên 1.4m
        kind: reach
        target: [0.0, 0.0, 1.4]
        radius: 0.42
        hold_sec: 0.4
        hint: "Tăng cần Ga (Cần trái lên / W) để bay lên độ cao (0, 0, 1.4m)"
      - name: Tiến thẳng trục Pitch (3.2m)
        kind: reach
        target: [3.2, 0.0, 1.4]
        radius: 0.48
        hold_sec: 0.4
        hint: "Đẩy cần Pitch lên (Cần phải lên / Mũi tên Lên) tiến 3.2m tới cổng trước"
      - name: Dịch ngang trục Roll (3.2m)
        kind: reach
        target: [3.2, -3.2, 1.4]
        radius: 0.48
        hold_sec: 0.4
        hint: "Đẩy cần Roll sang phải (Cần phải sang phải / Mũi tên Phải) dịch 3.2m"
      - name: Quay về trung tâm
        kind: hold
        target: [0.0, 0.0, 1.4]
        radius: 0.48
        hold_sec: 1.5
        hint: "Đưa UAV về điểm trung tâm (0, 0, 1.4m) và giữ yên 1.5 giây"

  - id: BT02
    version: 1
    code: BT02
    title: Cất cánh & Giữ độ cao chuẩn
    difficulty: Cơ bản
    summary: Cất cánh thẳng đứng lên độ cao 1.8m và duy trì ổn định trong vùng sai số ±0.38m liên tục 5 giây trước khi hạ cánh.
    objectives:
      - Cất cánh mượt từ bệ phóng (0, 0, 0.05m) lên độ cao 1.8m
      - Giữ độ cao chuẩn 1.8m liên tục trong 5 giây
      - Hạ cánh nhẹ nhàng trở lại tâm bệ phóng
    default_mode: position_hold
    time_limit_sec: 80
    corridor_radius: 0.55
    start_pos: [0.0, 0.0, 0.05]
    start_yaw: 0.0
    environment:
      wind_max: 0.15
      gust_sigma: 0.05
      map_preset: airbase
      arena_bounds: [6.0, 6.0, 5.0]
      obstacles: []
    stages:
      - name: Lên độ cao 1.8m
        kind: reach
        target: [0.0, 0.0, 1.8]
        radius: 0.38
        hold_sec: 0.0
        hint: "Tăng cần Ga đưa UAV lên độ cao 1.8m"
      - name: Giữ độ cao 1.8m (5s)
        kind: hold
        target: [0.0, 0.0, 1.8]
        radius: 0.40
        hold_sec: 5.0
        hint: "Giữ cần Ga ở vị trí cân bằng (50%) để treo tại 1.8m trong 5 giây"
      - name: Hạ cánh êm tại bệ
        kind: land
        target: [0.0, 0.0, 0.05]
        radius: 0.42
        max_landing_vz: 0.65
        hint: "Giảm nhẹ cần Ga để hạ cánh êm xuống tâm bệ phóng"

  - id: BT03
    version: 1
    code: BT03
    title: Treo tại chỗ & Chuyển điểm neo (Gió nhẹ)
    difficulty: Cơ bản
    summary: Duy trì vị trí UAV tại Điểm treo A (1.6m) rồi bay vượt gió nhẹ 4.5m sang Điểm treo B và giữ ổn định 4 giây.
    objectives:
      - Bay lên điểm treo A (0.0, 0.0, 1.6m) và giữ ổn định 4 giây
      - Dịch chuyển 4.5m sang điểm treo B (3.5, 2.8, 1.6m) và giữ ổn định 4 giây
      - Chống trôi dạt do gió nền 0.35 m/s
    default_mode: altitude_hold
    time_limit_sec: 100
    corridor_radius: 0.65
    start_pos: [0.0, 0.0, 0.05]
    start_yaw: 0.0
    environment:
      wind_max: 0.35
      gust_sigma: 0.18
      map_preset: airbase
      arena_bounds: [6.5, 6.5, 5.0]
      speed_scale: 1.4
      obstacles: []
    stages:
      - name: Điểm treo A (4s)
        kind: hold
        target: [0.0, 0.0, 1.6]
        radius: 0.44
        hold_sec: 4.0
        hint: "Giữ UAV ổn định trong vòng tròn A (0, 0, 1.6m) trong 4 giây"
      - name: Điểm treo B cách 4.5m (4s)
        kind: hold
        target: [3.5, 2.8, 1.6]
        radius: 0.48
        hold_sec: 4.0
        hint: "Bay 4.5m tới điểm treo B (3.5, 2.8, 1.6m) và giữ vị trí 4 giây ngược gió"

  - id: BT04
    version: 1
    code: BT04
    title: Bay theo hành lang Hình vuông (6m x 6m)
    difficulty: Trung bình
    summary: Điều khiển UAV bay khép kín qua 4 đỉnh hình vuông rộng 6.0m x 6.0m ở độ cao 1.6m với quỹ đạo thẳng và ổn định.
    objectives:
      - Duy trì độ cao 1.6m xuyên suốt 4 cạnh hình vuông dài 6.0m
      - Lần lượt đi qua 4 cổng góc vuông với độ lệch hành lang nhỏ nhất
      - Giữ thao tác cần mượt, tránh giật cục tại các góc cua 90 độ
    default_mode: altitude_hold
    time_limit_sec: 125
    corridor_radius: 0.68
    start_pos: [-3.0, -3.0, 0.05]
    start_yaw: 0.0
    environment:
      wind_max: 0.20
      gust_sigma: 0.10
      map_preset: airbase
      arena_bounds: [6.5, 6.5, 5.0]
      speed_scale: 1.5
      obstacles: []
    stages:
      - name: Cất cánh Đỉnh 1
        kind: reach
        target: [-3.0, -3.0, 1.6]
        radius: 0.46
        hint: "Cất cánh lên Đỉnh 1 (-3.0, -3.0, 1.6m)"
      - name: Cạnh 1 (6m) -> Đỉnh 2
        kind: reach
        target: [3.0, -3.0, 1.6]
        radius: 0.50
        hint: "Bay thẳng 6m dọc hành lang tới Đỉnh 2 (3.0, -3.0, 1.6m)"
      - name: Cạnh 2 (6m) -> Đỉnh 3
        kind: reach
        target: [3.0, 3.0, 1.6]
        radius: 0.50
        hint: "Rẽ trái 90 độ bay 6m tới Đỉnh 3 (3.0, 3.0, 1.6m)"
      - name: Cạnh 3 (6m) -> Đỉnh 4
        kind: reach
        target: [-3.0, 3.0, 1.6]
        radius: 0.50
        hint: "Bay dọc cạnh 3 dài 6m tới Đỉnh 4 (-3.0, 3.0, 1.6m)"
      - name: Khép vòng về Đỉnh 1
        kind: hold
        target: [-3.0, -3.0, 1.6]
        radius: 0.50
        hold_sec: 1.5
        hint: "Khép kín hình vuông về Đỉnh 1 (-3.0, -3.0, 1.6m) và dừng 1.5s"

  - id: BT05
