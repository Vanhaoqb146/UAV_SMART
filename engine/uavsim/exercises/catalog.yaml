      - name: Về tâm kết thúc
        kind: hold
        target: [0.0, 0.0, 1.6]
        radius: 0.50
        hold_sec: 1.5
        hint: "Hoàn thành số 8 tại tâm (0, 0, 1.6m) và giữ 1.5s"

  - id: BT06
    version: 1
    code: BT06
    title: Tiếp cận & Hạ cánh Chính xác (Cự ly 5.5m)
    difficulty: Trung bình
    summary: Đưa UAV từ điểm xuất phát cách bãi đáp 5.5m bay theo đường trượt tiếp cận (Glide-slope) về tâm chữ H và chạm đất êm.
    objectives:
      - Cất cánh từ điểm xa (-4.5, 3.0, 0.05m) lên độ cao hành trình 2.0m
      - Bay qua cổng tiếp cận trung gian (-2.2, 1.5, 1.6m) rồi treo trên bãi đáp (0.0, 0.0, 1.1m)
      - Giảm độ cao có kiểm soát, chạm đất trong bán kính 0.38m với |vz| < 0.55 m/s
    default_mode: altitude_hold
    time_limit_sec: 110
    corridor_radius: 0.65
    start_pos: [-4.5, 3.0, 0.05]
    start_yaw: 0.0
    environment:
      wind_max: 0.30
      gust_sigma: 0.15
      map_preset: airbase
      arena_bounds: [6.5, 6.5, 5.0]
      speed_scale: 1.5
      obstacles: []
    stages:
      - name: Lên độ cao hành trình (2.0m)
        kind: reach
        target: [-4.5, 3.0, 2.0]
        radius: 0.48
        hint: "Cất cánh lên độ cao hành trình (-4.5, 3.0, 2.0m)"
      - name: Cổng tiếp cận trung gian
        kind: reach
        target: [-2.2, 1.5, 1.6]
        radius: 0.48
        hint: "Hạ dần độ cao qua cổng tiếp cận (-2.2, 1.5, 1.6m)"
      - name: Điểm treo trên bãi đáp
        kind: hold
        target: [0.0, 0.0, 1.1]
        radius: 0.42
        hold_sec: 1.5
        hint: "Tiến vào ngay trên bãi đáp (0, 0, 1.1m) và giữ ổn định 1.5s"
      - name: Chạm đất chính xác
        kind: land
        target: [0.0, 0.0, 0.05]
        radius: 0.38
        max_landing_vz: 0.55
        hint: "Hạ ga từ từ để chạm đất êm tại tâm chữ H (0, 0)"

  - id: BT07
    version: 1
    code: BT07
    title: Xử trí Gió giật & Né Chướng ngại vật
    difficulty: Nâng cao
    summary: Điều khiển UAV vượt qua hành lang dài 8.4m có 4 cột trụ chướng ngại vật dưới tác động của gió giật Ornstein-Uhlenbeck.
    objectives:
      - Bù góc nghiêng chủ động trước gió giật (wind_max 0.65 m/s, gust 0.40 m/s)
      - Luồn lách an toàn qua 4 cột trụ cách đều trên hành lang 8.4m
      - Không va chạm cột và về đích an toàn
    default_mode: altitude_hold
    time_limit_sec: 130
    corridor_radius: 0.78
    start_pos: [-4.2, 0.0, 0.05]
    start_yaw: 0.0
    environment:
      wind_max: 0.65
      gust_sigma: 0.40
      map_preset: forest
      arena_bounds: [6.5, 6.5, 5.0]
      speed_scale: 1.5
      obstacles:
        - {x: -1.8, y: 0.0, r: 0.24, h: 2.8}
        - {x: 0.3, y: 1.25, r: 0.24, h: 2.8}
        - {x: 0.3, y: -1.25, r: 0.24, h: 2.8}
        - {x: 2.4, y: 0.0, r: 0.24, h: 2.8}
    stages:
      - name: Cất cánh đầu hành lang
        kind: reach
        target: [-4.2, 0.0, 1.5]
        radius: 0.48
        hint: "Cất cánh lên (-4.2, 0.0, 1.5m) chuẩn bị vượt chướng ngại vật"
      - name: Né cột 1 sang trái
        kind: reach
        target: [-1.8, 1.5, 1.5]
        radius: 0.52
        hint: "Lách sang trái cột trụ 1 qua cổng (-1.8, 1.5, 1.5m)"
      - name: Luồn khe giữa cột 2 & 3
        kind: reach
        target: [0.3, 0.0, 1.5]
        radius: 0.48
        hint: "Bay qua khe giữa 2 cột trụ tại (0.3, 0.0, 1.5m)"
      - name: Né cột 4 sang phải
        kind: reach
        target: [2.4, -1.5, 1.5]
        radius: 0.52
        hint: "Lách sang phải cột trụ 4 qua cổng (2.4, -1.5, 1.5m)"
      - name: Giữ vị trí tại đích
        kind: hold
        target: [4.2, 0.0, 1.5]
        radius: 0.48
        hold_sec: 2.0
        hint: "Tiến về đích (4.2, 0.0, 1.5m) và giữ ổn định 2 giây trong gió giật"

