  - id: BT09
    version: 1
    code: BT09
    title: Bay Luồn Rừng Cây Thực Địa
    difficulty: Nâng cao
    summary: "Bay xuyên tuyến đường mòn dài trong rừng cây 3D mật độ cao (48 cây có tán va chạm thật), vượt đỉnh tán cây thấp và đáp tại bãi trống tiền phương."
